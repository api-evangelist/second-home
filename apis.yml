name: Second Home
description: 'Second Home is a flexible workspace and cultural venue provider committed to supporting
  entrepreneurship, innovation, and community, with locations in London (Spitalfields and Holland Park)
  and Lisbon (Mercado da Ribeira). It offers coworking (resident and roaming desks), private offices,
  day passes, meeting-room and venue hire, and a program of cultural events. Surfaced as a portfolio
  company of Index Ventures and added to the API Evangelist network; enrichment found no public API,
  developer portal, or machine-readable developer surface — this is a consumer/business workspace brand
  rather than an API producer.'
